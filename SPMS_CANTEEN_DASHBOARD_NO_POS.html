<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPMS - Student Pocket Money Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .hero-gradient { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%); }
    .hidden { display: none !important; }
    /* Buri dashboard ifite ibara ryayo */
    .theme-admin   { --accent: #4f46e5; --accent-soft: #eef2ff; --accent-dark: #312e81; }
    .theme-canteen { --accent: #0d9488; --accent-soft: #f0fdfa; --accent-dark: #115e59; }
    .dash-banner { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #fff; }
    .tab-btn { padding: .75rem 1rem; border-bottom: 2px solid transparent; color: #475569; white-space: nowrap; font-weight: 600; }
    .tab-btn:hover { color: var(--accent); }
    .tab-btn.active { border-bottom-color: var(--accent); color: var(--accent); font-weight: 700; }
    .accent-btn { background: var(--accent); color: #fff; }
    .accent-btn:hover { filter: brightness(.92); }
    .accent-soft { background: var(--accent-soft); color: var(--accent); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800 flex flex-col justify-between" id="appBody">

  <!-- TOP NAVIGATION HEADER -->
  <header class="bg-indigo-950 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchRole('landing')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-400 to-amber-500 text-indigo-950 font-black flex items-center justify-center text-sm shadow-md border border-amber-300">SPMS</div>
        <div>
          <h1 class="font-bold text-lg leading-tight">SPMS</h1>
          <p class="text-[10px] text-indigo-200">Student Pocket Money Management System</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <nav class="flex flex-wrap items-center gap-1 sm:gap-2 text-xs font-semibold">
          <button id="navHomeBtn" onclick="switchRole('landing')" class="px-2.5 py-1.5 rounded-lg transition bg-indigo-700 text-white shadow">
            <i class="fa-solid fa-house mr-1"></i><span data-i18n="nav.home"></span>
          </button>
          <button id="navAdminBtn" onclick="switchRole('admin')" class="px-2.5 py-1.5 rounded-lg transition bg-indigo-900/80 hover:bg-indigo-800 text-indigo-100">
            <i class="fa-solid fa-user-shield mr-1"></i> Pocket Manager
          </button>
          <button id="navCanteenBtn" onclick="switchRole('canteen')" class="px-2.5 py-1.5 rounded-lg transition bg-indigo-900/80 hover:bg-indigo-800 text-indigo-100">
            <i class="fa-solid fa-utensils mr-1"></i> Canteen Manager
          </button>
          <button id="navStudentBtn" onclick="switchRole('student')" class="px-2.5 py-1.5 rounded-lg transition bg-indigo-900/80 hover:bg-indigo-800 text-indigo-100">
            <i class="fa-solid fa-user-graduate mr-1"></i><span data-i18n="nav.student"></span>
          </button>
        </nav>
        <div class="relative">
          <button type="button" id="menuBtn" onclick="toggleMenu(event)" class="px-2.5 py-1.5 rounded-lg transition bg-amber-400 hover:bg-amber-300 text-indigo-950 text-xs font-bold">
            <i class="fa-solid fa-bars mr-1"></i><span data-i18n="menu.title"></span>
          </button>
          <div id="menuList" class="hidden absolute right-0 mt-2 w-60 bg-white text-slate-800 rounded-xl shadow-2xl border border-slate-200 overflow-hidden text-xs font-semibold z-[60]">
            <button type="button" onclick="openInfo('support')" class="w-full text-left px-4 py-3 hover:bg-indigo-50 flex items-center gap-2"><i class="fa-solid fa-headset text-indigo-600 w-4"></i><span data-i18n="menu.support"></span></button>
            <button type="button" onclick="openInfo('guide')" class="w-full text-left px-4 py-3 hover:bg-indigo-50 flex items-center gap-2 border-t"><i class="fa-solid fa-book-open text-indigo-600 w-4"></i><span data-i18n="menu.guide"></span></button>
            <button type="button" onclick="openInfo('terms')" class="w-full text-left px-4 py-3 hover:bg-indigo-50 flex items-center gap-2 border-t"><i class="fa-solid fa-file-contract text-indigo-600 w-4"></i><span data-i18n="menu.terms"></span></button>
            <button type="button" onclick="openInfo('privacy')" class="w-full text-left px-4 py-3 hover:bg-indigo-50 flex items-center gap-2 border-t"><i class="fa-solid fa-user-shield text-indigo-600 w-4"></i><span data-i18n="menu.privacy"></span></button>
          </div>
        </div>
        <label class="flex items-center gap-1 text-xs">
          <i class="fa-solid fa-language"></i>
          <select id="langSelect" onchange="setLang(this.value)" aria-label="Language" class="bg-indigo-900 text-white border border-indigo-700 rounded-lg px-2 py-1.5 text-xs font-semibold outline-none">
            <option value="rw">Kinyarwanda</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="sw">Kiswahili</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-grow">

    <!-- ==================== 1. LANDING ==================== -->

      "reg.importDesc": [
        "Injiza abanyeshuri benshi bakoresheje idosiye ya Excel. Binjira nk'uko bari mu rutonde rwa Excel, hamwe na <b>Student ID, Class/Trade, Parent Name, Phone</b> n'<b>inkingi zose</b> ziri mu mbonerahamwe. <b>Nta murongo n'umwe urekwa.</b>",
        "Import many students from an Excel file. They go in exactly as listed in Excel, with <b>Student ID, Class/Trade, Parent Name, Phone</b> and <b>every column</b> of the table. <b>No row is skipped.</b>",
        "Importez de nombreux élèves depuis un fichier Excel. Ils entrent exactement comme dans Excel, avec <b>Student ID, Class/Trade, Parent Name, Phone</b> et <b>toutes les colonnes</b> du tableau. <b>Aucune ligne n'est ignorée.</b>",
        "Ingiza wanafunzi wengi kutoka faili ya Excel. Wanaingia kama walivyo kwenye Excel, pamoja na <b>Student ID, Class/Trade, Parent Name, Phone</b> na <b>safu zote</b> za jedwali. <b>Hakuna mstari unaoachwa.</b>"],
      "reg.hdrHint": [
        "Imitwe (headers) ishobora kuba nka: <b>Student ID</b>, <b>Lastname</b>, <b>Firstname</b> (cyangwa <b>Name</b>), <b>Class/Trade</b>, <b>Parent Name</b>, <b>Phone</b>, <b>Password</b> (si ngombwa). Izindi nkingi zose zibikwa uko ziri kandi ziboneka mu tab ya Abanyeshuri.",
        "Headers can be like: <b>Student ID</b>, <b>Lastname</b>, <b>Firstname</b> (or <b>Name</b>), <b>Class/Trade</b>, <b>Parent Name</b>, <b>Phone</b>, <b>Password</b> (optional). All other columns are kept as they are and appear in the Students tab.",
        "Les en-têtes peuvent être : <b>Student ID</b>, <b>Lastname</b>, <b>Firstname</b> (ou <b>Name</b>), <b>Class/Trade</b>, <b>Parent Name</b>, <b>Phone</b>, <b>Password</b> (facultatif). Toutes les autres colonnes sont conservées telles quelles et visibles dans l'onglet Élèves.",
        "Vichwa vinaweza kuwa kama: <b>Student ID</b>, <b>Lastname</b>, <b>Firstname</b> (au <b>Name</b>), <b>Class/Trade</b>, <b>Parent Name</b>, <b>Phone</b>, <b>Password</b> (si lazima). Safu nyingine zote zinahifadhiwa kama zilivyo na zinaonekana kwenye kichupo cha Wanafunzi."],

      "info.support.body": ["<p>Ufite ikibazo cyangwa ukeneye ubufasha kuri SPMS? Hamagara cyangwa wandikire <b>Pocket Manager</b>:</p><p class='my-3 text-xl font-black text-indigo-700'><i class='fa-solid fa-phone mr-2'></i>0780758388</p><div class='flex flex-wrap gap-2'><a href='tel:0780758388' class='px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg'><i class='fa-solid fa-phone mr-1'></i>Hamagara</a><a href='https://wa.me/250780758388' target='_blank' rel='noopener' class='px-4 py-2 bg-emerald-600 text-white font-semibold rounded-lg'><i class='fa-brands fa-whatsapp mr-1'></i>WhatsApp</a></div><p class='mt-3 text-slate-500'>Mu gihe cy'akazi gusa. Ntuzigere uha undi muntu password yawe.</p>", "<p>Have a question or need help with SPMS? Call or message the <b>Pocket Manager</b>:</p><p class='my-3 text-xl font-black text-indigo-700'><i class='fa-solid fa-phone mr-2'></i>0780758388</p><div class='flex flex-wrap gap-2'><a href='tel:0780758388' class='px-4 py-2 bg-indigo-600 text-white font-semibold rounded-lg'><i class='fa-solid fa-phone mr-1'></i>Call</a><a href='https://wa.me/250780758388' target='_blank' rel='noopener' class='px-4 py-2 bg-emerald-600 text-white font-semibold rounded-lg'><i class='fa-brands fa-whatsapp mr-1'></i>WhatsApp</a></div><p class='mt-3 text-slate-500'>During working hours. Never share your password with anyone.</p>"],
      "info.guide.body": ["<h4 class='font-bold text-slate-900 mt-3 mb-1'>1. Student (Umunyeshuri)</h4><ul class='list-disc pl-5 space-y-1'><li>Fungura <b>Student Portal</b>, wandike amazina yawe yuzuye na Student ID.</li><li>Ubona Balance yawe, amakuru yawe, n'amateka y'ibikorwa byawe byose (kubitsa no kubikuza).</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>2. Pocket Manager</h4><ul class='list-disc pl-5 space-y-1'><li>Injira ukoresheje Username na Password.</li><li><b>Bika</b>: shakisha umunyeshuri (inyuguti imwe y'izina cyangwa ID irahagije), uhitemo, ushyiremo amafaranga (nibura 50 RWF).</li><li><b>Kubikuza</b>: shakisha umunyeshuri, uhitemo, ushyiremo amafaranga uyamuhe.</li><li><b>Kwandika &amp; Import</b>: andika umunyeshuri umwe, cyangwa winjize urutonde rwa Excel (Student ID, Name, Class/Trade, Parent Name, Phone...). Class/Trade na Phone binjira nk'uko biri muri Excel.</li><li><b>Abanyeshuri</b>: reba urutonde rwose; <b>Gusiba</b>: siba umwe cyangwa bose; <b>Amateka</b>: reba ibikorwa byose.</li><li><b>Settings</b>: hindura ifoto, Username, Security Question na Password.</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>3. Canteen Manager</h4><ul class='list-disc pl-5 space-y-1'><li>Afite dashboard imwe na Pocket Manager: Deposit, Withdrawal, Kwandika &amp; Import, Abanyeshuri, Gusiba, Amateka na Settings.</li><li>Ashobora gucunga abanyeshuri, kubitsa no kubikuza amafaranga nk'uko Pocket Manager abikora.</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>4. Wibagiwe Password?</h4><ul class='list-disc pl-5 space-y-1'><li>Kanda <b>Wibagiwe Password?</b> ku rupapuro rwo kwinjira.</li><li>Andika Security Question wari washyizeho n'igisubizo cyayo, hanyuma ushyireho Password nshya.</li></ul>", "<h4 class='font-bold text-slate-900 mt-3 mb-1'>1. Student</h4><ul class='list-disc pl-5 space-y-1'><li>Open the <b>Student Portal</b> and enter your full name and Student ID.</li><li>You can see your balance, your details and your full transaction history (deposits and withdrawals).</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>2. Pocket Manager</h4><ul class='list-disc pl-5 space-y-1'><li>Log in with your username and password.</li><li><b>Deposit</b>: search a student (one letter of the name or ID is enough), select, enter the amount (minimum 50 RWF).</li><li><b>Withdraw</b>: search a student, select, enter the amount to pay out.</li><li><b>Register &amp; Import</b>: add one student, or import an Excel list (Student ID, Name, Class/Trade, Parent Name, Phone...). Class/Trade and Phone are imported exactly as in Excel.</li><li><b>Students</b>: see everyone; <b>Delete</b>: remove one or all; <b>History</b>: see every transaction.</li><li><b>Settings</b>: change your photo, username, security question and password.</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>3. Canteen Manager</h4><ul class='list-disc pl-5 space-y-1'><li>Has the same dashboard as the Pocket Manager: Deposit, Withdrawal, Register &amp; Import, Students, Delete, History and Settings.</li><li>Can manage students, make deposits and withdrawals just like the Pocket Manager.</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>4. Forgot password?</h4><ul class='list-disc pl-5 space-y-1'><li>Click <b>Forgot Password?</b> on the login page.</li><li>Enter the security question you set and its answer, then choose a new password.</li></ul>"],
      "info.terms.body": ["<h4 class='font-bold text-slate-900 mt-3 mb-1'>1. Gukoresha SPMS</h4><p>SPMS ikoreshwa n'ikigo cy'amashuri gucunga amafaranga y'imbere y'abanyeshuri. Abemerewe kuyikoresha ni Pocket Manager, Canteen Manager n'abanyeshuri (kureba amakuru yabo gusa).</p><h4 class='font-bold text-slate-900 mt-3 mb-1'>2. Inshingano z'uyikoresha</h4><ul class='list-disc pl-5 space-y-1'><li>Kurinda Username na Password byawe no kutabiha abandi.</li><li>Kwandika amakuru nyayo kandi akwiye: amafaranga yabitswe, yabikujwe cyangwa yaguzwe agomba kuba ari ay'ukuri.</li><li>Kudakoresha system mu buryo butemewe, cyangwa kugerageza kwinjira nk'undi muntu.</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>3. Amafaranga</h4><p>SPMS ni uburyo bwo kwandika no gukurikirana. Amafaranga nyayo acungwa n'ikigo; ibyo wanditse muri system bigomba guhura n'amafaranga ari mu maboko.</p><h4 class='font-bold text-slate-900 mt-3 mb-1'>4. Kudahabwa ingwate</h4><p>System itangwa uko iri. Abayikoze ntibabazwa ibura ry'amakuru ryatewe no gusiba, kwangirika kwa device cyangwa gusukura browser. Ni byiza kubika kopi y'abanyeshuri (Excel).</p><h4 class='font-bold text-slate-900 mt-3 mb-1'>5. Impinduka</h4><p>Aya mabwiriza ashobora guhinduka. Gukomeza gukoresha SPMS bisobanura kwemera impinduka.</p>", "<h4 class='font-bold text-slate-900 mt-3 mb-1'>1. Use of SPMS</h4><p>SPMS is used by the school to manage students' pocket money. Authorised users are the Pocket Manager, the Canteen Manager and students (who can only view their own information).</p><h4 class='font-bold text-slate-900 mt-3 mb-1'>2. User responsibilities</h4><ul class='list-disc pl-5 space-y-1'><li>Keep your username and password private and do not share them.</li><li>Enter accurate information: deposits, withdrawals and purchases must reflect real transactions.</li><li>Do not misuse the system or attempt to sign in as another person.</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>3. Money</h4><p>SPMS records and tracks balances. The actual cash is handled by the school; what you record in the system must match the money physically held.</p><h4 class='font-bold text-slate-900 mt-3 mb-1'>4. No warranty</h4><p>The system is provided as is. The creators are not liable for data loss caused by deletion, device failure or clearing the browser. Keeping a copy of the student list (Excel) is recommended.</p><h4 class='font-bold text-slate-900 mt-3 mb-1'>5. Changes</h4><p>These terms may change. Continued use of SPMS means you accept the changes.</p>"],
      "info.privacy.body": ["<h4 class='font-bold text-slate-900 mt-3 mb-1'>Amakuru dukusanya</h4><ul class='list-disc pl-5 space-y-1'><li>Abanyeshuri: Student ID, amazina, Class/Trade, Parent Name, Phone, Balance n'amateka y'ibikorwa.</li><li>Abayobozi (Managers): Username, ifoto ya profile, Security Question n'igisubizo, Password.</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>Aho abikwa</h4><p>Amakuru abikwa <b>muri browser y'iyi device</b> (localStorage). Ntabwo yoherezwa ku zindi seriveri cyangwa ku bandi bantu. Iyo browser isukuwe cyangwa device ikaba itandukanye, amakuru ntagaragara.</p><h4 class='font-bold text-slate-900 mt-3 mb-1'>Uko akoreshwa</h4><p>Akoreshwa gusa mu gucunga amafaranga y'imbere y'abanyeshuri mu kigo. Ntagurishwa kandi ntahabwa abandi.</p><h4 class='font-bold text-slate-900 mt-3 mb-1'>Ubwirinzi n'uburenganzira</h4><ul class='list-disc pl-5 space-y-1'><li>Umunyeshuri abona amakuru ye gusa; Managers nibo babona urutonde rwose.</li><li>Pocket Manager ashobora gusiba umunyeshuri umwe cyangwa bose.</li><li>Wowe ukoresha uri nyir'ubwite bwo kurinda Password yawe.</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>Ubufasha</h4><p>Ku bibazo bijyanye n'amakuru yawe, hamagara Pocket Manager kuri <b>0780758388</b>.</p>", "<h4 class='font-bold text-slate-900 mt-3 mb-1'>Information we collect</h4><ul class='list-disc pl-5 space-y-1'><li>Students: Student ID, name, Class/Trade, Parent Name, Phone, balance and transaction history.</li><li>Managers: username, profile photo, security question and answer, password.</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>Where it is stored</h4><p>Data is stored <b>in this device's browser</b> (localStorage). It is not sent to other servers or third parties. If the browser data is cleared or a different device is used, the data will not appear.</p><h4 class='font-bold text-slate-900 mt-3 mb-1'>How it is used</h4><p>Only to manage students' pocket money at the school. It is never sold or shared.</p><h4 class='font-bold text-slate-900 mt-3 mb-1'>Protection and rights</h4><ul class='list-disc pl-5 space-y-1'><li>Students only see their own information; only managers see the full list.</li><li>The Pocket Manager can delete one student or all students.</li><li>You are responsible for keeping your password safe.</li></ul><h4 class='font-bold text-slate-900 mt-3 mb-1'>Support</h4><p>For questions about your data, call the Pocket Manager on <b>0780758388</b>.</p>"],

    let lang = 'rw';
    try { const saved = localStorage.getItem('spms_lang'); if (saved && LANGS.includes(saved)) lang = saved; } catch (e) { /* ntacyo */ }

    function t(key, vars) {
      const row = T[key];
      let s = row ? (row[LANGS.indexOf(lang)] || row[1]) : key;
      if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
      return s;
    }

    function applyLang() {
      document.documentElement.lang = lang;
      const sel = document.getElementById('langSelect');
      if (sel) sel.value = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-ph')); });
      document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.getAttribute('data-i18n-title')); });
    }

    // SHA-256 isanzwe (synchronous) ikoreshwa mu gukora urufunguzo rw'umunyeshuri
    function sha256hex(str) {
      const rr = (v, a) => (v >>> a) | (v << (32 - a));
      const bytes = Array.from(new TextEncoder().encode(str));
      const maxWord = Math.pow(2, 32), hash = [], k = [], comp = {};
      let pc = 0;
      for (let c = 2; pc < 64; c++) {
        if (!comp[c]) {
          for (let i = 0; i < 313; i += c) comp[i] = c;
          hash[pc] = (Math.pow(c, .5) * maxWord) | 0;
          k[pc++] = (Math.pow(c, 1 / 3) * maxWord) | 0;
        }
      }
      const len = bytes.length;
      bytes.push(0x80);
      while (bytes.length % 64 !== 56) bytes.push(0);
      const hi = Math.floor(len * 8 / maxWord), lo = (len * 8) >>> 0;
      bytes.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255, (lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);
      const H = hash.slice(0, 8);
      for (let off = 0; off < bytes.length; off += 64) {
        const w = new Array(64);
        for (let i = 0; i < 16; i++) w[i] = (bytes[off + i * 4] << 24) | (bytes[off + i * 4 + 1] << 16) | (bytes[off + i * 4 + 2] << 8) | bytes[off + i * 4 + 3];
        for (let i = 16; i < 64; i++) {
          const s0 = rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
          const s1 = rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
          w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
        }
        let [a, b, c, d, e, f, g, h] = H;
        for (let i = 0; i < 64; i++) {
          const S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25), ch = (e & f) ^ (~e & g);
          const t1 = (h + S1 + ch + k[i] + w[i]) | 0;
          const S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22), maj = (a & b) ^ (a & c) ^ (b & c);
          const t2 = (S0 + maj) | 0;
          h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
        }
        H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
        H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
      }
      return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
    }
    window.sha256hex = sha256hex;
    // Urufunguzo rw'umunyeshuri = hash(Student ID | izina). Ni rwo rukoreshwa nka "login" (ID + izina), ntiruhangwa.
    function studentSid(id, name) { return sha256hex('spms|' + String(id).trim().toUpperCase() + '|' + normText(name)); }

    // ---- Recovery: password ya manager ifungwa (AES-GCM) n'urufunguzo rukomoka ku kibazo + igisubizo (PBKDF2)
    const _enc = new TextEncoder(), _dec = new TextDecoder();
    const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
    async function recKey(question, answer, salt) {
      const base = await crypto.subtle.importKey('raw', _enc.encode(normQ(question) + '|' + String(answer).trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }
    async function sealRecovery(question, answer, password) {
      const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await recKey(question, answer, salt), _enc.encode(password));
      return { salt: b64(salt), iv: b64(iv), ct: b64(ct) };
    }
    async function openRecovery(rec, question, answer) {
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(rec.iv) }, await recKey(question, answer, unb64(rec.salt)), unb64(rec.ct));
      return _dec.decode(pt);
    }
    window.sealRecovery = sealRecovery; window.openRecovery = openRecovery;

    // ---- Adapter ya Firebase (iyindi ishobora gusimbura mu bizamini ikoresheje window.SPMS_CLOUD_OVERRIDE)
    async function makeFirebaseAdapter(cfg) {
      const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      const app = A.initializeApp(cfg), auth = Au.getAuth(app), db = F.getFirestore(app);
      const clean = o => JSON.parse(JSON.stringify(o));
      const withId = (d, key) => Object.assign({ [key]: d.id }, d.data());
      return {
        async signIn(role, pw) { await Au.signInWithEmailAndPassword(auth, MGR_EMAIL[role], pw); },
        async signOut() { await Au.signOut(auth); },
        async changePassword(pw) { await Au.updatePassword(auth.currentUser, pw); },
        async getPublic(role) { const s = await F.getDoc(F.doc(db, 'profiles', role)); return s.exists() ? s.data() : null; },
        async setPublic(role, data) { await F.setDoc(F.doc(db, 'profiles', role), clean(data)); },
        async getPrivate(role) { const s = await F.getDoc(F.doc(db, 'private', role)); return s.exists() ? s.data() : null; },
        async setPrivate(role, data) { await F.setDoc(F.doc(db, 'private', role), clean(data)); },
        onStudents(cb, err) { return F.onSnapshot(F.collection(db, 'students'), snap => cb(snap.docs.map(d => withId(d, 'sid'))), err); },
        onAllLogs(cb, err) { return F.onSnapshot(F.collectionGroup(db, 'logs'), snap => cb(snap.docs.map(d => withId(d, 'lid'))), err); },
        async getStudent(sid) { const s = await F.getDoc(F.doc(db, 'students', sid)); return s.exists() ? withId(s, 'sid') : null; },
        onStudent(sid, cb, err) { return F.onSnapshot(F.doc(db, 'students', sid), s => cb(s.exists() ? withId(s, 'sid') : null), err); },
        onStudentLogs(sid, cb, err) { return F.onSnapshot(F.collection(db, 'students', sid, 'logs'), snap => cb(snap.docs.map(d => withId(d, 'lid'))), err); },
        async commit(ops) {
          for (let i = 0; i < ops.length; i += 400) {
            const batch = F.writeBatch(db);
            ops.slice(i, i + 400).forEach(op => {
              if (op.type === 'set') batch.set(F.doc(db, 'students', op.sid), clean(op.data));
              else if (op.type === 'update') { const d = clean(op.data); if (op.inc) d.balance = F.increment(op.inc); batch.update(F.doc(db, 'students', op.sid), d); }
              else if (op.type === 'delete') batch.delete(F.doc(db, 'students', op.sid));
              else if (op.type === 'log') batch.set(F.doc(F.collection(db, 'students', op.sid, 'logs')), clean(op.data));
            });
            await batch.commit();
          }
        }
      };
    }
    function cloudInit() {
      if (!window.CLOUD_MODE) return Promise.resolve(null);
      if (!cloudReady) {
        cloudReady = (window.SPMS_CLOUD_OVERRIDE ? Promise.resolve(window.SPMS_CLOUD_OVERRIDE) : makeFirebaseAdapter(FB_CFG))
          .then(a => (CL = a)).catch(e => { cloudReady = null; throw e; });
      }
      return cloudReady;
    }

    // ---- Kuringaniza amakuru y'abanyeshuri n'amateka na Firestore
    const STUDENT_FIELDS = ['id', 'name', 'class', 'parentName', 'phone', 'extra', 'balance', 'seq'];
    let cloudBase = {};          // uid -> JSON y'uko seriveri iri
    let cloudUnsubs = [];
    let pendingLogs = [];
    let cloudQueue = Promise.resolve();
    let seqCounter = 0;
    const nextSeq = () => Date.now() * 1000 + (seqCounter++ % 1000);
    function toDoc(s) { const d = {}; STUDENT_FIELDS.forEach(k => { if (s[k] !== undefined) d[k] = s[k]; }); return d; }
    function sj(d) { const o = {}; Object.keys(d).sort().forEach(k => { o[k] = d[k]; }); return JSON.stringify(o); }
    function fromRemote(d) { const s = Object.assign({}, d, { uid: d.sid }); delete s.sid; return s; }

    function saveCloud() {
      if (!CL || !cloudBase.__ready) return;
      const ops = [], seen = new Set();
      window.students.forEach(s => {
        seen.add(s.uid);
        const d = toDoc(s), js = sj(d), prev = cloudBase[s.uid];
        if (prev === js) return;
        if (prev === undefined) ops.push({ type: 'set', sid: s.uid, data: d });
        else {
          const p = JSON.parse(prev), upd = {};
          Object.keys(d).forEach(k => { if (k !== 'balance' && JSON.stringify(d[k]) !== JSON.stringify(p[k])) upd[k] = d[k]; });
          const delta = (d.balance || 0) - (p.balance || 0);
          if (Object.keys(upd).length || delta) ops.push({ type: 'update', sid: s.uid, data: upd, inc: delta });
        }
        cloudBase[s.uid] = js;
      });
      Object.keys(cloudBase).forEach(k => { if (k !== '__ready' && !seen.has(k)) { ops.push({ type: 'delete', sid: k }); delete cloudBase[k]; } });
      pendingLogs.splice(0).forEach(l => ops.push({ type: 'log', sid: l.studentUid, data: { time: l.time, ts: l.ts, studentUid: l.studentUid, studentId: l.studentId, studentName: l.studentName, type: l.type, amount: l.amount, balanceAfter: l.balanceAfter, note: l.note || "" } }));
      if (!ops.length) return;
      cloudQueue = cloudQueue.then(() => CL.commit(ops)).catch(onCloudErr);
    }

    function startCloudListeners() {
      stopCloudListeners();
      cloudBase = {};
      return new Promise((resolve, reject) => {
        let gotS = false, gotL = false, done = false;
        const check = () => { if (gotS && gotL && !done) { done = true; cloudBase.__ready = true; resolve(); } };
        const fail = e => { if (!done) { done = true; reject(e); } else onCloudErr(e); };
        cloudUnsubs.push(CL.onStudents(list => {
          list.sort((a, b) => (a.seq || 0) - (b.seq || 0) || String(a.id).localeCompare(String(b.id)));
          const ready = cloudBase.__ready;
          cloudBase = { __ready: ready };
          window.students = list.map(d => { const s = fromRemote(d); cloudBase[s.uid] = sj(toDoc(s)); return s; });
          gotS = true; check(); refreshRemote();
        }, fail));
        cloudUnsubs.push(CL.onAllLogs(list => {
          window.logs = list.map(d => { const l = Object.assign({}, d); delete l.lid; return l; }).sort((a, b) => (b.ts || 0) - (a.ts || 0));
          gotL = true; check(); refreshRemote();
        }, fail));
      });
    }

    const authFail = e => { const c = String((e && e.code) || ''); return /invalid-credential|wrong-password|user-not-found|invalid-login/.test(c) ? 'bad' : (/too-many/.test(c) ? 'many' : 'net'); };

    // ==================== HELPERS ====================
    function $(id) { return document.getElementById(id); }
    function esc(v) { return String(v ?? "").replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function sameId(a, b) { return String(a).trim().toUpperCase() === String(b).trim().toUpperCase(); }
    // findStudent ikoresha uid y'imbere (ntihurira, nubwo Student ID yasubiwemo muri Excel)

    function normText(v) { return String(v ?? "").toLowerCase().replace(/\s+/g, " ").trim(); }
    function tokenKey(v) { return normText(v).split(" ").filter(Boolean).sort().join(" "); }
    function normQ(v) { return String(v ?? "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

    function exactMatches(q) {
      const nq = normText(q);

        const id = normText(s.id);
        const nameWords = normText(s.name).split(" ").filter(Boolean);
        if (id.startsWith(nq) || (nq.length >= 2 && id.includes(nq))) return true;
        return nameWords.length > 0 && words.every(w => nameWords.some(nw => nw.startsWith(w)));
      });
      return res.sort((a, b) => normText(a.name).localeCompare(normText(b.name)));
    }

    // ==================== EXCEL IMPORT ====================
    // Buri murongo wose wa Excel winjira, n'inkingi zose zibikwa uko ziri. Nta kirengagizwa.
    function normHeader(v) { return String(v ?? "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
    function cellText(v) { return String(v ?? "").trim(); }

    // Imitwe isobanurwa ku buryo bworoshye ("Class/Trade", "Parent Name", "Phone", "Telephone", "Guardian", ...)
    function classifyHeader(raw) {
      const h = normHeader(raw);
      if (!h) return null;
      const has = (...a) => a.some(x => h.includes(x));
      if (has('password', 'pwd', 'ijambobanga') || h === 'pass') return 'password';
      if (has('phone', 'mobile', 'whatsapp', 'contact', 'telefone', 'telefoni', 'telephone', 'simu', 'telno', 'telnumber', 'parenttel', 'guardiantel', 'nimero', 'numero', 'tel') || h === 'tel' || h === 'tels') return 'phone';
      if (has('parent', 'guardian', 'umubyeyi', 'ababyeyi', 'father', 'mother', 'sponsor', 'tutor', 'tuteur')) return 'parent';
      if (['id', 'idno', 'code', 'scts', 'sctscode'].includes(h) || has('studentid', 'studentno', 'studentnumber', 'studentcode', 'regno', 'regnumber', 'registration', 'matricule', 'admission', 'indangamuntu', 'identifiant')) return 'id';
      if (has('class', 'trade', 'combination', 'combo', 'filiere', 'ishami', 'icyiciro', 'darasa', 'stream') || ['level', 'year', 'department', 'section', 'grade', 'option'].includes(h)) return 'cls';
      if (has('lastname', 'surname', 'familyname', 'izinaryanyuma', 'nomdefamille')) return 'lastName';
      if (has('firstname', 'givenname', 'forename', 'izinaryambere', 'prenom')) return 'firstName';
      if (['fullname', 'name', 'names', 'studentname', 'studentsname', 'nameofstudent', 'amazina', 'izina', 'amazinayose', 'nom', 'nomcomplet'].includes(h) || has('fullname', 'studentname')) return 'fullName';
      return null;
    }

    function mapRow(row) {
      const cols = {};
      (row || []).forEach((cell, idx) => {
        const k = classifyHeader(cell);
        if (k && cols[k] === undefined) cols[k] = idx;
      });
      return cols;
    }
    function hasNameCol(c) { return c.fullName !== undefined || c.lastName !== undefined || c.firstName !== undefined; }

    // Shaka umurongo w'imitwe. Iyo nta mutwe w'izina ubonetse, umurongo wa mbere utarimo ubusa ufatwa nk'imitwe.
    function findHeaderRow(rows) {
      for (let i = 0; i < Math.min(rows.length, 10); i++) {
        const c = mapRow(rows[i]);
        if (hasNameCol(c)) return { idx: i, cols: c, guessed: false };
      }
      const first = rows.findIndex(r => r && r.some(c => cellText(c) !== ""));
      if (first < 0) return null;
      const cols = mapRow(rows[first]);
      if (!hasNameCol(cols)) {
        const taken = new Set(Object.values(cols));
        const w = Math.max(...rows.slice(first, first + 5).map(r => (r || []).length), 1);
        let pick = 0;
        while (taken.has(pick) && pick < w - 1) pick++;
        cols.fullName = pick;
      }
      return { idx: first, cols, guessed: true };
    }

    const FIELD_LABELS = { id: 'Student ID', fullName: 'Name', lastName: 'Lastname', firstName: 'Firstname', cls: 'Class/Trade', parent: 'Parent Name', phone: 'Phone', password: 'Password' };

    // Isuzuma imirongo yose ya Excel ikavamo abanyeshuri (nta DOM, bityo yageragezwa byoroshye)
    function parseStudentRows(rows, existingIds) {
      const out = { list: [], added: 0, dupIds: 0, noName: 0, generated: 0, hasHeader: false, guessed: false, headerIdx: -1, extraLabels: [], mapped: [], missing: [], rowsRead: 0 };
      const hr = findHeaderRow(rows);
      if (!hr) return out;
      const cols = hr.cols;
      out.hasHeader = true; out.guessed = hr.guessed; out.headerIdx = hr.idx;

      const headerRow = rows[hr.idx] || [];
      // Niba umutwe wa Phone utamenyekanye, shaka inkingi irimo nimero za telefone (imibare 9+) mu mirongo yayo
      if (cols.phone === undefined) {
        const taken = new Set(Object.values(cols));
        const sample = rows.slice(hr.idx + 1, hr.idx + 41).filter(r => r && r.some(c => cellText(c) !== ""));
        const w0 = Math.max(headerRow.length, ...sample.map(r => r.length), 0);
        for (let c = 0; c < w0; c++) {
          if (taken.has(c)) continue;
          const vals = sample.map(r => cellText(r[c])).filter(Boolean);
          if (vals.length && vals.filter(v => /^\+?[\d\s\-()]{8,}$/.test(v) && v.replace(/\D/g, '').length >= 8).length >= vals.length * 0.6) { cols.phone = c; break; }
        }
      }
      ['id', 'fullName', 'lastName', 'firstName', 'cls', 'parent', 'phone', 'password'].forEach(k => {
        if (cols[k] !== undefined) out.mapped.push(`${FIELD_LABELS[k]} ← [${cellText(headerRow[cols[k]]) || ('#' + (cols[k] + 1))}]`);
      });
      ['id', 'cls', 'parent', 'phone'].forEach(k => { if (cols[k] === undefined) out.missing.push(FIELD_LABELS[k]); });

      const seen = new Set(existingIds.map(x => String(x).toUpperCase()));
      let counter = 5000 + existingIds.length;
      const nextFreeId = () => { let id; do { id = `SCTS${counter++}`; } while (seen.has(id)); return id; };

      // Inkingi zose zitabitswe mu bice by'ibanze zibikwa nk'"ibindi" n'umutwe wazo
      const used = new Set(['id', 'fullName', 'lastName', 'firstName', 'cls', 'password', 'parent', 'phone'].map(k => cols[k]).filter(v => v !== undefined));
      const width = Math.max(headerRow.length, ...rows.slice(hr.idx + 1).map(r => (r || []).length), 0);
      const extraCols = [];
      const labelCount = {};
      for (let idx = 0; idx < width; idx++) {
        if (used.has(idx)) continue;
        let label = cellText(headerRow[idx]) || `Column ${idx + 1}`;
        labelCount[label] = (labelCount[label] || 0) + 1;
        if (labelCount[label] > 1) label = `${label} (${labelCount[label]})`;
        extraCols.push({ idx, label });
      }
      out.extraLabels = extraCols.map(c => c.label);

      for (let i = hr.idx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.every(c => cellText(c) === "")) continue; // umurongo urimo ubusa rwose gusa
        out.rowsRead++;
        const g = k => cols[k] !== undefined ? cellText(row[cols[k]]) : "";

        let name = cols.fullName !== undefined ? g('fullName') : "";
        if (!name) name = `${g('lastName')} ${g('firstName')}`.trim();
        if (!name) out.noName++;

        let id = g('id');
        if (!id) { id = nextFreeId(); out.generated++; }
        if (seen.has(id.toUpperCase())) out.dupIds++; // ntisimbutswa: yinjira uko iri
        seen.add(id.toUpperCase());

        const extra = [];
        extraCols.forEach(c => { const v = cellText(row[c.idx]); if (v !== "") extra.push({ label: c.label, value: v }); });

        out.list.push({
          id, password: g('password') || `PASS${id.slice(-4)}`, name,
          class: g('cls'), parentName: g('parent'), phone: g('phone'),
          extra, balance: 0
        });
        out.added++;
      }
      return out;
    }

    window.lastImport = null;
    function renderImportReport() {
      const r = window.lastImport;
      const rep = $('importReport');
      if (!r) { rep.classList.add('hidden'); return; }

      rep.innerHTML = `
        <p class="font-bold text-emerald-700"><i class="fa-solid fa-circle-check mr-1"></i> ${esc(t('rep.rows', { r: r.rowsRead, a: r.added }))}</p>
        ${r.hasHeader ? `<p>${esc(t('rep.header', { n: r.headerIdx + 1 }))} ${r.guessed ? esc(t('rep.guessed')) : ""}</p>` : ""}
        ${r.mapped.length ? `<p>${esc(t('rep.mapped', { list: r.mapped.join(", ") }))}</p>` : ""}
        ${r.missing.length ? `<p class="text-amber-700">${esc(t('rep.missing', { list: r.missing.join(", ") }))}</p>` : ""}
        ${r.extraLabels.length ? `<p>${esc(t('rep.extra', { list: r.extraLabels.join(", ") }))}</p>` : ""}
        ${r.dupIds ? `<p class="text-amber-700">${esc(t('rep.dup', { n: r.dupIds }))}</p>` : ""}
        ${r.skipped ? `<p class="text-amber-700">${esc(t('rep.skip', { n: r.skipped }))}</p>` : ""}
        ${r.noName ? `<p class="text-amber-700">${esc(t('rep.noName', { n: r.noName }))}</p>` : ""}
        ${r.generated ? `<p class="text-amber-700">${esc(t('rep.gen', { n: r.generated }))}</p>` : ""}`;
    }

    window.importExcelStudents = function(inputId) {
      if (!requireRole('manager')) return;
      const fileInput = $(inputId);
      const file = fileInput.files[0];
      if (!file) { notifyErr(t('m.pickFile')); return; }
      if (typeof XLSX === 'undefined') { notifyErr(t('m.noXlsx')); return; }
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheet = workbook.Sheets[workbook.SheetNames[0]];
          // Merged cells (urugero Class/Trade ihuriweho n'abanyeshuri benshi) zuzuzwa kugira ngo buri murongo ubone agaciro kayo nk'uko bigaragara muri Excel
          (sheet['!merges'] || []).forEach(m => {
            const first = sheet[XLSX.utils.encode_cell(m.s)];
            if (!first) return;
            for (let R = m.s.r; R <= m.e.r; R++) for (let C = m.s.c; C <= m.e.c; C++) {
              const addr = XLSX.utils.encode_cell({ r: R, c: C });
              if (!sheet[addr]) sheet[addr] = { t: first.t, v: first.v, w: first.w };
            }
          });
          const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });
          const r = parseStudentRows(rows, window.students.map(s => s.id));
          let skipped = 0;
          const seqBase = window.CLOUD_MODE ? nextSeq() : 0;
          r.list.forEach((s, i) => { if (window.CLOUD_MODE) s.seq = seqBase + i; if (assignUid(s)) window.students.push(s); else skipped++; });
          r.added -= skipped; r.skipped = skipped;
          saveData();

          window.lastImport = r;
          renderImportReport();
          if (r.added > 0) notify(t('m.importOk', { n: r.added }));
          else notifyErr(t('m.importNone'));
          window.updateStats();
          window.renderStudentsTable();
          fileInput.value = "";
        } catch (err) { notifyErr(t('m.importErr', { msg: err.message })); }
      };
      reader.readAsArrayBuffer(file);
    };

    // ==================== STUDENTS TABLE ====================
    window.renderStudentsTable = function() {
      const q = $('stuListSearch').value;
      const rows = normText(q) ? exactMatches(q) : window.students;
      const limited = false; // Pocket Manager na Canteen Manager babona imbonerahamwe yuzuye
      const labels = [];
      if (!limited) window.students.forEach(s => (s.extra || []).forEach(x => { if (!labels.includes(x.label)) labels.push(x.label); }));
      const heads = limited
        ? [t('th.no'), t('th.id'), t('th.name'), t('th.class'), t('th.balance')]
        : [t('th.no'), t('th.id'), t('th.name'), t('th.class'), t('th.parent'), t('th.phone'), ...labels, t('th.balance')];
      $('stuTableHead').innerHTML = "<tr>" + heads.map(h => `<th class="p-2 border-b">${esc(h)}</th>`).join("") + "</tr>";
      const body = $('stuTableBody');
      body.innerHTML = "";
      rows.forEach((s, i) => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50";
        let cells;
        if (limited) cells = [i + 1, s.id, dispName(s), s.class, s.balance + " RWF"];
        else {
          const ex = labels.map(l => { const f = (s.extra || []).find(x => x.label === l); return f ? f.value : ""; });
          cells = [i + 1, s.id, dispName(s), s.class, s.parentName, s.phone, ...ex, s.balance + " RWF"];
        }
        tr.innerHTML = cells.map((c, k) => `<td class="p-2 ${k === 2 ? 'font-bold' : ''}">${esc(c)}</td>`).join("");
        body.appendChild(tr);
      });
      $('stuListCount').textContent = `(${rows.length}${normText(q) ? "" : " / " + window.students.length})`;
      if (normText(q) && rows.length === 0) {
        body.innerHTML = `<tr><td class="p-3 text-amber-700 font-semibold" colspan="${heads.length}">${esc(t('search.noresult'))}</td></tr>`;
      }
    };

    // ==================== DEPOSIT (Pocket Manager) ====================
    window.searchDepStudent = function() {
      const q = $('depSearchInput').value;
      const container = $('depSearchResults');
      container.innerHTML = "";
      $('depFormBox').classList.add('hidden');
      $('depNoResultMsg').classList.add('hidden');
      if (!normText(q)) return;

      const found = exactMatches(q);
      if (found.length === 0) { $('depNoResultMsg').classList.remove('hidden'); return; }

      found.forEach(s => {
        const div = document.createElement('div');
        div.className = "p-3 bg-white border rounded-lg cursor-pointer flex justify-between items-center text-xs";
        div.onclick = () => {
          window.currentStudentTargetId = s.uid;
          $('depStudentFullDetails').innerHTML = renderStudentDetailsHtml(s, false);
          $('depFormBox').classList.remove('hidden');
        };
        div.innerHTML = `<div><p class="font-bold">${esc(dispName(s))}</p><p class="text-[10px] text-slate-500">${esc(s.id)} - ${esc(dash(s.class))}</p></div><span class="font-bold text-emerald-600">${s.balance} RWF</span>`;
        container.appendChild(div);
      });
    };

    function addLog(s, type, amount, note) {
      const l = { time: new Date().toLocaleString(), ts: Date.now(), studentUid: s.uid, studentId: s.id, studentName: dispName(s), type, amount, balanceAfter: s.balance, note: note || "" };
      window.logs.unshift(l);
      if (window.CLOUD_MODE) pendingLogs.push(l);
    }

    window.executeDeposit = function(e) {
      e.preventDefault();
      if (!requireRole('manager')) return;
      const s = findStudent(window.currentStudentTargetId);
      if (!s) { notifyErr(t('m.pickStudent')); return; }
      const amt = parseInt($('depositAmount').value, 10);
      if (!amt || amt < 50) { notifyErr(t('m.min50')); return; }
      s.balance += amt;
      addLog(s, "DEPOSIT", amt, $('depositNote').value.trim());
      saveData();
      notify(t('m.deposited'));
      window.updateStats();
      $('depositAmount').value = "";
      $('depositNote').value = "";
      $('depFormBox').classList.add('hidden');
      $('depSearchInput').value = "";
      $('depSearchResults').innerHTML = "";
    };

    // ==================== WITHDRAW (Pocket Manager) ====================
    window.searchWithStudent = function() {
      const q = $('withSearchInput').value;
      const container = $('withSearchResults');
      container.innerHTML = "";
      $('withdrawActionBox').classList.add('hidden');
      $('withNoResultMsg').classList.add('hidden');
      if (!normText(q)) return;
      const found = exactMatches(q);
      if (found.length === 0) { $('withNoResultMsg').classList.remove('hidden'); return; }
      found.forEach(s => {
        const div = document.createElement('div');
        div.className = "p-3 bg-white border rounded-lg cursor-pointer flex justify-between items-center text-xs";
        div.onclick = () => {
          window.currentStudentTargetId = s.uid;
          $('withStudentFullDetails').innerHTML = renderStudentDetailsHtml(s, false);
          $('withdrawActionBox').classList.remove('hidden');
        };
        div.innerHTML = `<div><p class="font-bold">${esc(dispName(s))}</p><p class="text-[10px] text-slate-500">${esc(s.id)} - ${esc(dash(s.class))}</p></div><span class="font-bold text-emerald-600">${s.balance} RWF</span>`;
        container.appendChild(div);
      });
    };

    window.executeWithdrawal = function(e) {
      e.preventDefault();
      if (!requireRole('manager')) return;
      const s = findStudent(window.currentStudentTargetId);
      if (!s) { notifyErr(t('m.verifyFirst')); return; }
      const amt = parseInt($('withdrawAmount').value, 10);
      if (!amt || amt < 50) { notifyErr(t('m.min50')); return; }
      if (amt > s.balance) { notifyErr(t('m.noFunds', { bal: s.balance })); return; }
      s.balance -= amt;
      addLog(s, "WITHDRAWAL", amt, "");
      saveData();
      notify(t('m.withdrawn'));
      window.updateStats();
      $('withdrawAmount').value = "";
      $('withdrawActionBox').classList.add('hidden');
      $('withSearchInput').value = "";
      $('withSearchResults').innerHTML = "";
    };

    // ==================== DELETE (Pocket Manager) ====================
    window.deleteStudentByUid = function(uid) {
      if (!requireRole('manager')) return;
      askConfirm(t('confirm.one'), t('confirm.yes'), () => {
        window.students = window.students.filter(s => s.uid !== uid);
        saveData();
        notify(t('m.deleted'));
        window.updateStats();
        window.searchDeleteStudent();
      });
    };

    window.deleteAllStudents = function() {
      if (!requireRole('manager')) return;
      askConfirm(t('confirm.all'), t('confirm.yesAll'), () => {
        window.students = [];
        saveData();
        notify(t('m.deletedAll'));
        window.updateStats();
        window.searchDeleteStudent();
      });
    };

    window.searchDeleteStudent = function() {
      const q = $('deleteSearch').value;
      const list = $('deleteStudentList');
      list.innerHTML = "";
      const items = normText(q) ? exactMatches(q) : window.students;
      if (normText(q) && items.length === 0) {
        list.innerHTML = `<div class="p-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-lg text-xs font-semibold">${esc(t('search.noresult'))}</div>`;
        return;
      }
      items.forEach(s => {
        const div = document.createElement('div');
        div.className = "p-2.5 bg-white border rounded-lg flex justify-between items-center text-xs";
        const info = document.createElement('div');
        info.innerHTML = `<p class="font-bold">${esc(dispName(s))}</p><p class="text-[10px] text-slate-500">${esc(s.id)} - ${esc(dash(s.class))}${s.parentName ? " - " + esc(t('lbl.parent')) + ": " + esc(s.parentName) : ""}</p>`;
        const btn = document.createElement('button');
        btn.className = "px-2.5 py-1 bg-rose-500 text-white rounded hover:bg-rose-600";
        btn.innerHTML = `<i class="fa-solid fa-trash"></i> ${esc(t('del.btn'))}`;
        btn.onclick = () => window.deleteStudentByUid(s.uid);
        div.appendChild(info);
        div.appendChild(btn);
        list.appendChild(div);
      });
    };

    // ==================== TRANSACTION HISTORY ====================
    window.renderLogsTable = function() {
      const tbody = $('logsTableBody');
      tbody.innerHTML = "";
      const items = window.logs;
      items.forEach(l => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50";
        tr.innerHTML = `<td class="p-2 text-slate-400">${esc(l.time)}</td><td class="p-2 font-bold">${esc(l.studentName)}</td><td class="p-2">${esc(t('type.' + l.type))}</td><td class="p-2 font-bold text-emerald-600">${l.amount} RWF</td><td class="p-2">${l.balanceAfter} RWF</td><td class="p-2">${esc(l.note || t('note.' + l.type))}</td>`;
        tbody.appendChild(tr);
      });
    };

    // ==================== REGISTER ONE STUDENT (Pocket Manager) ====================
    window.handleStudentRegister = function(e) {
      e.preventDefault();
      if (!requireRole('manager')) return;
      const id = $('regId').value.trim();
      const name = $('regName').value.trim();
      const trade = $('regTrade').value.trim();
      const parent = $('regParent').value.trim();
      const phone = $('regPhone').value.trim();
      if (window.students.some(s => sameId(s.id, id))) { notifyErr(t('m.idExists')); return; }
      const stu = { id, name, class: trade, parentName: parent, phone, extra: [], balance: 0 };
      if (!assignUid(stu)) { notifyErr(t('m.idExists')); return; }
      window.students.push(stu);
      saveData();
      notify(t('m.registered'));
      window.updateStats();
      e.target.reset();
    };

    // ==================== STUDENT LOGIN (Amazina + Student ID) ====================
    window.portalUid = null;
    function renderStudentPortal() {
      const s = findStudent(window.portalUid);
      if (!s) return;
      $('stuPortalName').textContent = dispName(s);
      $('stuPortalDetails').textContent = `${t('lbl.id')}: ${s.id} | ${t('lbl.class')}: ${dash(s.class)}`;
      $('stuPortalBalance').textContent = `${s.balance} RWF`;
      $('stuPortalInfo').innerHTML = studentInfoRows(s, false).map(r => `<p><b>${esc(r[0])}:</b> ${esc(dash(r[1]))}</p>`).join("");
      // Amateka y'ibikorwa by'uyu munyeshuri gusa (bishya mbere)
      const mine = window.logs.filter(l => l.studentUid !== undefined ? l.studentUid === s.uid : (sameId(l.studentId, s.id) && l.studentName === dispName(s)));
      $('stuPortalHistory').innerHTML = mine.map(l => `<tr><td class="p-2 text-slate-400">${esc(l.time)}</td><td class="p-2">${esc(t('type.' + l.type))}</td><td class="p-2 font-bold ${l.type === 'DEPOSIT' ? 'text-emerald-600' : 'text-rose-600'}">${l.type === 'DEPOSIT' ? '+' : '-'}${l.amount} RWF</td><td class="p-2">${l.balanceAfter} RWF</td><td class="p-2">${esc(l.note || t('note.' + l.type))}</td></tr>`).join("");
      $('stuPortalNoHistory').classList.toggle('hidden', mine.length > 0);
    }

    window.handleStudentLogin = function(e) {
      e.preventDefault();
      const nameInput = normText($('stuLoginName').value);
      const idInput = $('stuLoginId').value.trim();
      if (window.CLOUD_MODE) { studentLoginCloud(idInput, $('stuLoginName').value); return; }
      const s = window.students.find(x => sameId(x.id, idInput) && normText(x.name) === nameInput);

      if (!s) {
        $('studentLoginError').classList.remove('hidden');
        notifyErr(t('m.stuBad'));
        noteFail('student');
        return;
      }
      window.failedAttempts.student = 0;
      window.portalUid = s.uid;
      $('studentLoginError').classList.add('hidden');
      $('studentAuthCard').classList.add('hidden');
      $('studentPortal').classList.remove('hidden');
      renderStudentPortal();
      notify(t('m.welcome', { name: dispName(s) }));
    };

    window.studentLogout = function() {
      if (window.CLOUD_MODE) { stopStudentListeners(); window.students = []; window.logs = []; }
      window.portalUid = null;
      $('studentAuthCard').classList.remove('hidden');
      $('studentPortal').classList.add('hidden');
      $('stuLoginName').value = "";
      $('stuLoginId').value = "";
    };

    // ==================== MENU & INFO PAGES ====================
    window.toggleMenu = function(ev) {
      if (ev) ev.stopPropagation();
      $('menuList').classList.toggle('hidden');
    };
    document.addEventListener('click', function(ev) {
      const list = $('menuList');
      if (list && !list.classList.contains('hidden') && !list.contains(ev.target)) list.classList.add('hidden');
    });
    window.closeInfo = function() {
      const el = document.getElementById('infoModal');
      if (el) el.remove();
    };
    window.openInfo = function(kind) {
      $('menuList').classList.add('hidden');
      window.closeInfo();
      window.infoKind = kind;
      const ov = document.createElement('div');
      ov.id = 'infoModal';
      ov.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(15,23,42,.6);display:flex;align-items:center;justify-content:center;padding:16px;';
      ov.onclick = ev => { if (ev.target === ov) window.closeInfo(); };
      const box = document.createElement('div');
      box.className = 'bg-white rounded-2xl shadow-2xl w-full max-w-xl max-h-[85vh] flex flex-col text-xs text-slate-700';
      box.innerHTML = '<div class="flex items-center justify-between px-5 py-3 border-b"><h3 id="infoTitle" class="font-black text-base text-indigo-900"></h3><button type="button" id="infoCloseX" class="text-slate-400 hover:text-slate-700 text-lg" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div id="infoBody" class="p-5 overflow-y-auto leading-relaxed"></div><div class="px-5 py-3 border-t text-right"><button type="button" id="infoCloseBtn" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg"></button></div>';
      ov.appendChild(box);
      document.body.appendChild(ov);
      $('infoCloseX').onclick = window.closeInfo;
      $('infoCloseBtn').onclick = window.closeInfo;
      renderInfo();
    };
    function renderInfo() {
      const el = document.getElementById('infoModal');
      if (!el) return;
      const k = window.infoKind;
      $('infoTitle').textContent = t('menu.' + k);
      $('infoBody').innerHTML = t('info.' + k + '.body');
      $('infoCloseBtn').textContent = t('modal.close');
    }
    document.addEventListener('keydown', function(ev) { if (ev.key === 'Escape') window.closeInfo(); });

    // ==================== LANGUAGE SWITCH ====================
    window.setLang = function(l) {
      if (!LANGS.includes(l)) return;
      lang = l;
      try { localStorage.setItem('spms_lang', l); } catch (e) { /* ntacyo */ }
      applyLang();
      // Subiramo ibyerekanwa bikozwe na JavaScript
      if (window.session) {
        $('managerBadgeName').textContent = window.creds[window.session].user + ' (' + t('role.' + window.session) + ')';
        if (window.activeTab === 'stu') window.renderStudentsTable();
        if (window.activeTab === 'del') window.searchDeleteStudent();
        if (window.activeTab === 'logs') window.renderLogsTable();
        if (window.activeTab === 'set') $('setRoleLabel').textContent = t('role.' + window.session);
        const sel = findStudent(window.currentStudentTargetId);
        if (sel) {
          if (!$('depFormBox').classList.contains('hidden')) $('depStudentFullDetails').innerHTML = renderStudentDetailsHtml(sel, false);
          if (!$('withdrawActionBox').classList.contains('hidden')) $('withStudentFullDetails').innerHTML = renderStudentDetailsHtml(sel, false);
          if (!$('posFormBox').classList.contains('hidden')) $('posStudentFullDetails').innerHTML = renderStudentDetailsHtml(sel, false);
        }
      }
      if (!$('forgotCard').classList.contains('hidden')) $('forgotRoleLabel').textContent = t('role.' + window.forgotRole) + " - " + window.creds[window.forgotRole].user;
      if (window.portalUid !== null && !$('studentPortal').classList.contains('hidden')) renderStudentPortal();
      renderImportReport();
      renderInfo();
    };

    applyLang();
    applyProfileUI();
    window.updateStats();
  </script>
</body>
